<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FashionHub | Luxury Finds</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,700;1,400&family=Poppins:wght@300;400;600&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #fcfcfc; color: #222; }
        .font-serif { font-family: 'Bodoni Moda', serif; }
        .product-card { background: white; transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1); border-bottom: 3px solid transparent; }
        .product-card:hover { transform: translateY(-10px); box-shadow: 0 30px 60px rgba(0,0,0,0.08); border-bottom: 3px solid #E60023; }
        .img-container img { transition: transform 1.5s ease; }
        .product-card:hover img { transform: scale(1.1); }
        .fa-pinterest { color: #E60023; transition: all 0.3s; }
        .fa-instagram { color: #E4405F; transition: all 0.3s; }
        .fa-facebook { color: #1877F2; transition: all 0.3s; }
        .social-icon:hover { transform: scale(1.3); filter: brightness(1.1); }
    </style>
</head>
<body>
    <nav class="bg-white/95 backdrop-blur-sm sticky top-0 z-50 border-b p-5 flex justify-between items-center px-6 md:px-24">
        <a href="index.html" class="text-3xl font-serif font-bold tracking-tighter">Fashion<span class="text-[#E60023]">Hub</span></a>
        <div class="hidden md:flex space-x-12 text-[10px] font-bold uppercase tracking-[0.3em] text-gray-400">
            <a href="index.html" class="text-black border-b border-black pb-1">Home</a>
            <a href="shop.html" class="hover:text-black transition">The Shop</a>
            <a href="connect.html" class="hover:text-black transition">Contact</a>
        </div>
        <div class="flex items-center">
             <a href="https://pinterest.com" target="_blank" class="social-icon text-3xl"><i class="fab fa-pinterest"></i></a>
        </div>
    </nav>

    <header class="relative h-[85vh] flex items-center justify-center text-center px-4 overflow-hidden">
        <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=2000')] bg-cover bg-center">
            <div class="absolute inset-0 bg-black/40"></div>
        </div>
        <div class="relative z-10 animate__animated animate__fadeIn">
            <h2 class="text-white text-6xl md:text-8xl font-serif italic mb-6">Style Secrets</h2>
            <p class="text-white/80 uppercase tracking-[0.6em] text-[10px] md:text-xs mb-10 font-bold">International Affiliate Selection • 2026</p>
            <a href="shop.html" class="bg-white text-black px-14 py-5 text-[10px] font-bold uppercase tracking-widest hover:bg-[#E60023] hover:text-white transition-all duration-500 shadow-2xl">Explore Collection</a>
        </div>
    </header>

    <main class="container mx-auto py-28 px-6">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12 lg:gap-16">
            <script>
                const products = [
                    { title: "Satin Evening Dress", price: "$120.00", img: "https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=800" },
                    { title: "Diamond Pendant", price: "$45.00", img: "https://images.unsplash.com/photo-1535639818669-c059d2ff844f?w=800" },
                    { title: "Designer Stilettos", price: "$89.00", img: "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=800" },
                    { title: "Minimal Leather Bag", price: "$65.00", img: "https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=800" },
                    { title: "Italian Sunglasses", price: "$55.00", img: "https://images.unsplash.com/photo-1511499767390-90342f46b817?w=800" },
                    { title: "Vintage Trench Coat", price: "$199.00", img: "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=800" }
                ];
                products.forEach((p, i) => {
                    document.write(`
                        <div class="product-card group animate__animated animate__fadeInUp" style="animation-delay: ${i * 0.1}s">
                            <div class="img-container h-[480px] overflow-hidden"><img src="${p.img}" class="w-full h-full object-cover"></div>
                            <div class="p-8 text-center">
                                <h4 class="text-xl font-serif italic mb-2">${p.title}</h4>
                                <div class="text-sm font-light text-gray-400 mb-8 uppercase tracking-widest">${p.price}</div>
                                <a href="#" class="bg-black text-white block w-full py-4 text-[9px] font-bold uppercase tracking-[0.2em] hover:bg-[#E60023] transition">Shop In USD</a>
                            </div>
                        </div>
                    `);
                });
            </script>
        </div>
    </main>

    <footer class="bg-white border-t pt-20 pb-12">
        <div class="container mx-auto px-6 grid grid-cols-1 md:grid-cols-3 gap-20 text-center md:text-left">
            <div><h4 class="text-2xl font-serif font-bold mb-8 tracking-tighter">FashionHub</h4><p class="text-gray-400 text-xs uppercase tracking-[0.2em] font-light">Global Curator for high-end fashion trends.</p></div>
            <div class="flex flex-col space-y-5 text-[10px] font-bold uppercase tracking-[0.3em] text-gray-600">
                <a href="index.html">Home</a><a href="shop.html">The Shop</a><a href="connect.html">Contact</a>
            </div>
            <div><h5 class="text-[10px] font-bold uppercase tracking-[0.4em] mb-8">Follow Us</h5>
                <div class="flex justify-center md:justify-start space-x-12 text-3xl">
                    <a href="#" class="social-icon"><i class="fab fa-pinterest"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-facebook"></i></a>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
