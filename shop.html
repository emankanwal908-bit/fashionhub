<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Shop | Emma Fashion Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,700;1,400&family=Poppins:wght@300;400;600&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #fcfcfc; }
        .font-serif { font-family: 'Bodoni Moda', serif; }
        .product-card { background: white; transition: all 0.4s; border: 1px solid #f1f1f1; }
        .product-card:hover { transform: translateY(-8px); border-bottom: 2px solid #E60023; }
    </style>
</head>
<body>
    <nav class="bg-white/95 backdrop-blur-sm sticky top-0 z-50 border-b p-5 flex justify-between items-center px-6 md:px-24">
        <a href="index.html" class="text-3xl font-serif font-bold tracking-tighter">Emma<span class="text-[#E60023]">Hub</span></a>
        <div class="hidden md:flex space-x-12 text-[10px] font-bold uppercase tracking-[0.3em] text-gray-400">
            <a href="index.html" class="hover:text-black transition">Home</a>
            <a href="shop.html" class="text-black border-b border-black pb-1">The Shop</a>
            <a href="connect.html" class="hover:text-black transition">Contact</a>
        </div>
    </nav>

    <main class="container mx-auto py-24 px-6">
        <h2 class="text-5xl font-serif italic text-center mb-16">The Collection</h2>
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
            
            <div class="product-card p-2 text-center">
                <img src="https://images.unsplash.com/photo-1506126613408-eca07ce68773?w=500" class="w-full h-64 object-cover">
                <h4 class="text-[10px] font-bold uppercase mt-4">Manifesting Mastery</h4>
                <p class="text-[#E60023] font-bold my-2">$27.00</p>
                <a href="https://bottomlinemanifesting.com/#aff=EmmaLifestyleHub" target="_blank" class="bg-black text-white px-4 py-2 text-[9px] uppercase font-bold block">Get Access</a>
            </div>

            <div class="product-card p-2 text-center">
                <img src="https://images.unsplash.com/photo-1490645935967-10de6ba17061?w=500" class="w-full h-64 object-cover">
                <h4 class="text-[10px] font-bold uppercase mt-4">Ultimate Keto Guide</h4>
                <p class="text-[#E60023] font-bold my-2">$19.00</p>
                <a href="https://www.digistore24.com/redir/466293/EmmaLifestyleHub/" target="_blank" class="bg-black text-white px-4 py-2 text-[9px] uppercase font-bold block">Shop Now</a>
            </div>

            <div class="product-card p-2 text-center">
                <img src="https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?w=500" class="w-full h-64 object-cover">
                <h4 class="text-[10px] font-bold uppercase mt-4">Independent Backyard</h4>
                <p class="text-[#E60023] font-bold my-2">$37.00</p>
                <a href="https://independentbackyard.com/my-book/#aff=EmmaLifestyleHub" target="_blank" class="bg-black text-white px-4 py-2 text-[9px] uppercase font-bold block">Download</a>
            </div>

            <script>
                const items = [
                    {n: "Maxi Dress", p: "$40.00", img: "https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=500"},
                    {n: "Jewelry Set", p: "$20.00", img: "https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=500"},
                    {n: "Summer Bag", p: "$55.00", img: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=500"},
                    {n: "Heels", p: "$70.00", img: "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=500"},
                    {n: "Scarf", p: "$15.00", img: "https://images.unsplash.com/photo-1520903920243-00d872a2d1c9?w=500"},
                    {n: "Glasses", p: "$12.00", img: "https://images.unsplash.com/photo-1508296636986-f3928113ff42?w=500"},
                    {n: "Watch", p: "$90.00", img: "https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=500"},
                    {n: "Earrings", p: "$10.00", img: "https://images.unsplash.com/photo-1630019852942-f89202989a59?w=500"}
                ];
                document.write(items.map(i => `
                    <div class="product-card p-2 text-center">
                        <img src="${i.img}" class="w-full h-64 object-cover">
                        <h4 class="text-[10px] font-bold uppercase mt-4 font-sans">${i.n}</h4>
                        <p class="text-[#E60023] font-bold my-2">${i.p}</p>
                        <a href="#" class="bg-gray-100 text-gray-400 px-4 py-2 text-[9px] uppercase font-bold block">Coming Soon</a>
                    </div>
                `).join(''));
            </script>
        </div>
    </main>
</body>
</html>
